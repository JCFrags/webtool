# The server is shared by a trusted group. Libraries have no private visibility.
bind = "127.0.0.1:8420"
data_dir = "data"
max_bytes = 26214400
network_concurrency = 12
parse_concurrency = 2
job_concurrency = 2
crawl_concurrency = 4
browser_concurrency = 2
request_timeout_seconds = 30
helper_timeout_seconds = 90
cache_seconds = 3600
user_agent = "webtool/0.1 (+shared research reader)"
search_engines = ["duckduckgo", "brave"]
browser_wait_ms = 2000
browser_no_sandbox = false

# Set only the helpers installed on the server. Clients do not install these.
# lightpanda_path = "/usr/local/bin/lightpanda"
# chromium_path = "/usr/bin/chromium"
# ytdlp_path = "/usr/local/bin/yt-dlp"
# ytdlp_js_runtime = "node" # Node >=22; use runtime:/path/to/executable if needed.

# Optional Xberg overrides. Document support is included in the normal server.
# Only native PDF text is verified. OCR and Office formats are not verified.
# [document_config]
# use_cache = false
# output_format = "plain"
# enable_quality_processing = false
# [document_config.pages]
# extract_pages = true

# fastCRW configuration is intentionally absent.
# The --features crw-browser integration is experimental, not a default fallback.

# Web-search budgets are shared across clients, separate from ordinary reads.
[search]
timeout_ms = 8000 # Includes provider admission, pacing, headers, and body.
concurrency = 4 # Active provider requests across all web searches.
max_bytes = 4194304 # Per response, also capped by the top-level max_bytes.

# These are the defaults for every provider. Omitted fields keep these defaults.
# Only names in search_engines are called. Provider order is not a fallback chain.
[search.providers.duckduckgo]
timeout_ms = 6000 # Request/body budget after admission; global deadline still applies.
concurrency = 1
interval_ms = 1000 # Minimum interval between starts; zero explicitly disables pacing.

[search.providers.brave]
timeout_ms = 6000
concurrency = 1
interval_ms = 1000
