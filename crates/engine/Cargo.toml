[package]
name = "webtool-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["web-extraction", "web-search"]
web-extraction = ["dep:rs-trafilatura"]
web-search = ["dep:metadata-search-engine-rs"]
documents = ["dep:xberg"]
ocr = ["documents", "xberg/sceptre-ocr-ort", "xberg/layout-detection"]
crw-browser = ["dep:crw-core", "dep:crw-renderer"]

[dependencies]
webtool-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
csv.workspace = true
feed-rs.workspace = true
futures-util.workspace = true
hex.workspace = true
html-escape.workspace = true
infer.workspace = true
regex.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
rusqlite.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
rs-trafilatura = { version = "=0.2.2", optional = true }
metadata-search-engine-rs = { version = "=0.3.2", optional = true }
xberg = { version = "=1.1.1", default-features = false, features = ["tokio-runtime", "pdf", "office", "excel", "xml", "email"], optional = true }
crw-core = { version = "=0.34.0", default-features = false, features = ["cdp"], optional = true }
crw-renderer = { version = "=0.34.0", default-features = false, features = ["cdp"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
